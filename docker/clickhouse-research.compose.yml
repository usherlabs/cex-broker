services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: cex-broker-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../schema/clickhouse/market_data.sql:/docker-entrypoint-initdb.d/01_market_data.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Research/dev forwarder: bind-mounts the repo for live-reload against a
  # host `bun install`. For a standalone prod image build
  # services/archive-forwarder/Dockerfile instead (self-contained, no mount).
  archive-forwarder:
    # Same bun floor as the production images: bun <= 1.3.9 can drop the
    # terminating chunk of an empty chunked HTTP response and hang a ClickHouse
    # read forever, and this runs the real forwarder against ClickHouse.
    image: oven/bun:1.3.14
    container_name: cex-broker-archive-forwarder
    working_dir: /app
    command: ["bun", "run", "services/archive-forwarder/index.ts"]
    ports:
      - "8090:8090"
    environment:
      - ARCHIVE_FORWARDER_PORT=8090
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD
      - CLICKHOUSE_DATABASE=market_data
      - ARCHIVE_FORWARDER_SPOOL_PATH=/var/lib/archive-forwarder/spool.sqlite
    volumes:
      - ..:/app
      - archive_forwarder_spool:/var/lib/archive-forwarder
    depends_on:
      - clickhouse

volumes:
  clickhouse_data:
  archive_forwarder_spool:

networks:
  default:
    name: fiet-sandbox
    external: true
