# .github/workflows/publish.yml

name: Publish

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*' # Matches semver tags in the format of v1.2.3
      - 'v[0-9]*.[0-9]*.[0-9]*-*' # Matches semver tags in the format of v1.2.3-beta
  # Manual releases default to npm only and require the approved revision.
  workflow_dispatch:
    inputs:
      expected_git_head:
        description: Approved full Git commit to publish
        required: true
        type: string
      publish_docker:
        description: Also publish the broker Docker image (including latest)
        required: false
        type: boolean
        default: false

env:
  IMAGE_NAME: ghcr.io/usherlabs/cex-broker

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history: the archive baseline test resolves BASELINE_COMMIT^ and
          # diffs it against its parent, which a shallow clone cannot satisfy.
          fetch-depth: 0

      - name: Verify requested release revision
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_GIT_HEAD: ${{ inputs.expected_git_head }}
          ACTUAL_GIT_HEAD: ${{ github.sha }}
        run: |
          if [[ ! "$EXPECTED_GIT_HEAD" =~ ^[0-9a-f]{40}$ ]] || [[ "$EXPECTED_GIT_HEAD" != "$ACTUAL_GIT_HEAD" ]]; then
            echo "Release revision does not match the approved full commit" >&2
            exit 1
          fi

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          # Pinned, not floating: bun <= 1.3.9 can drop the terminating chunk of
          # an empty chunked HTTP response, which hangs a ClickHouse read
          # forever. request_timeout cannot rescue it — the client implements
          # that with socket.setTimeout, which Bun's node:http client ignores.
          # Measured at ~1% of query bursts on 1.3.9 and zero on 1.3.12 and
          # later, so keep this at 1.3.12 or above.
          bun-version: 1.3.14

      - name: Setup Node.js for npm publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      # This package publishes via npm trusted publishing (OIDC, id-token
      # permission) — no NPM_TOKEN secret exists. OIDC needs npm >= 11.5.1,
      # newer than any runner-bundled npm; without it the placeholder token is
      # sent and the registry PUT 404s. Pinned to a major because npm@latest
      # broke every tag run when npm 12 dropped the then-pinned Node 20.
      - name: Install npm with trusted-publishing support
        run: npm install -g npm@12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protobuf types
        run: bun run proto-gen

      - name: Run tests
        run: bun test

      - name: Run Biome check
        run: bun run check

      - name: Pack through ordinary prepack
        id: package
        run: |
          mkdir -p "$RUNNER_TEMP/package-candidate"
          npm pack --pack-destination "$RUNNER_TEMP/package-candidate"
          echo "tarball=$RUNNER_TEMP/package-candidate/usherlabs-cex-broker-$(node -p "require('./package.json').version").tgz" >> "$GITHUB_OUTPUT"

      - name: Verify the immutable tarball
        run: bun run check:package --tarball "${{ steps.package.outputs.tarball }}" --expected-git-head "${{ github.sha }}" --output "$RUNNER_TEMP/package-check"

      - name: Retain release evidence
        uses: actions/upload-artifact@v4
        with:
          name: typed-package-release
          path: |
            ${{ runner.temp }}/package-candidate/*.tgz
            ${{ runner.temp }}/package-check/package-evidence.json

      # Publish exactly the verified bytes; do not rerun prepack or rebuild.
      # Trusted publishing still uses OIDC (id-token: write), never a token.
      - name: Publish verified tarball to npm
        run: npm publish "${{ steps.package.outputs.tarball }}" --ignore-scripts --provenance --access public

  publish-docker:
    if: github.event_name == 'push' || inputs.publish_docker
    runs-on: ubuntu-latest
    needs: publish-npm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release convention tags the version-bump commit, so package.json
      # is the version authority on both tag pushes and dispatch republishes
      # (a git-tag-derived name is empty on workflow_dispatch).
      - name: Read package version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            CEX_BROKER_BUILD_GIT_HEAD=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
