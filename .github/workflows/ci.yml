# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: integration-test
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          # Pinned, not floating: bun <= 1.3.9 can drop the terminating chunk of
          # an empty chunked HTTP response, which hangs a ClickHouse read
          # forever. request_timeout cannot rescue it — the client implements
          # that with socket.setTimeout, which Bun's node:http client ignores.
          # Measured at ~1% of query bursts on 1.3.9 and zero on 1.3.12 and
          # later, so keep this at 1.3.12 or above.
          bun-version: 1.3.14

      - name: Setup Node.js for packed consumers
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Install npm
        run: npm install -g npm@12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protobuf types
        run: bun run proto-gen

      - name: Run repository checks
        run: |
          bun run check
          bun run check:server-lines
          bun run typecheck:sidecar

      - name: Verify archive-forwarder image starts
        run: ./services/archive-forwarder/scripts/archive-forwarder-image-smoke.sh

      - name: Resolve ClickHouse integration endpoint
        run: |
          for host in localhost clickhouse; do
            if curl --fail --silent --max-time 2 "http://${host}:8123/ping" >/dev/null; then
              echo "CLICKHOUSE_TEST_URL=http://${host}:8123" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "ClickHouse integration service is unreachable" >&2
          exit 1

      - name: Run normal tests
        run: bun run test
        env:
          CLICKHOUSE_REQUIRED: "1"
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: integration-test

      - name: Cache pinned ClickHouse Local
        uses: actions/cache@v4
        with:
          path: .cache/clickhouse-local
          key: clickhouse-local-25.8.24.21-a687eff77c58afbe

      - name: Run required archive E2E regression
        run: bun run test:e2e:archive

      - name: Validate current OpenSpec state
        run: bunx @fission-ai/openspec@1.3.1 validate --all --strict

      # Gate PRs on the same strict build the publish workflow runs on tag push
      # (dts-bundle-generator + strict tsc). Without this, develop can merge code
      # that only fails at publish time, blocking releases.
      - name: Pack through ordinary prepack
        id: package
        run: |
          mkdir -p "$RUNNER_TEMP/package-candidate"
          npm pack --pack-destination "$RUNNER_TEMP/package-candidate"
          echo "tarball=$RUNNER_TEMP/package-candidate/usherlabs-cex-broker-$(node -p "require('./package.json').version").tgz" >> "$GITHUB_OUTPUT"

      - name: Verify packed package and external consumers
        run: bun run check:package --tarball "${{ steps.package.outputs.tarball }}" --expected-git-head "${{ github.sha }}" --output "$RUNNER_TEMP/package-check"

      - name: Retain candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: typed-package-candidate
          path: |
            ${{ runner.temp }}/package-candidate/*.tgz
            ${{ runner.temp }}/package-check/package-evidence.json
