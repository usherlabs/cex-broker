name: Archive Live CEX Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  archive-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: archive-live-smoke

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install

      - name: Cache pinned ClickHouse Local
        uses: actions/cache@v4
        with:
          path: .cache/clickhouse-local
          key: clickhouse-local-25.8.24.21-linux-amd64-a687eff77c58afbe

      - name: Run public read-only archive smoke
        run: bun run test:smoke:archive
        env:
          CEX_BROKER_SMOKE_READ_ONLY_ATTESTED: "true"
          CEX_BROKER_CREDENTIAL_SOURCE_POLICY: provisioned_only
          CEX_BROKER_PROVISIONED_CREDENTIAL_PROFILE: read_only_key
          CEX_BROKER_SMOKE_EXCHANGE: ${{ vars.ARCHIVE_SMOKE_EXCHANGE }}
          CEX_BROKER_SMOKE_SYMBOL: ${{ vars.ARCHIVE_SMOKE_SYMBOL }}
          CEX_BROKER_SMOKE_API_KEY: ${{ secrets.ARCHIVE_SMOKE_API_KEY }}
          CEX_BROKER_SMOKE_API_SECRET: ${{ secrets.ARCHIVE_SMOKE_API_SECRET }}
          CEX_BROKER_CREDENTIAL_ATTESTATION_KIND: operator_provisioning_record
          CEX_BROKER_CREDENTIAL_ATTESTATION_REFERENCE: ${{ vars.ARCHIVE_SMOKE_READ_ONLY_ATTESTATION }}
