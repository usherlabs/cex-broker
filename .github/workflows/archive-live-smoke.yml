name: Archive Live CEX Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  archive-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: archive-live-smoke

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          # Pinned, not floating: bun <= 1.3.9 can drop the terminating chunk of
          # an empty chunked HTTP response, which hangs a ClickHouse read
          # forever. request_timeout cannot rescue it — the client implements
          # that with socket.setTimeout, which Bun's node:http client ignores.
          # Measured at ~1% of query bursts on 1.3.9 and zero on 1.3.12 and
          # later, so keep this at 1.3.12 or above.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Cache pinned ClickHouse Local
        uses: actions/cache@v4
        with:
          path: .cache/clickhouse-local
          key: clickhouse-local-25.8.24.21-linux-amd64-a687eff77c58afbe

      - name: Run credentialless public archive smoke
        run: bun run test:smoke:archive
        env:
          CEX_BROKER_SMOKE_EXCHANGE: ${{ vars.ARCHIVE_SMOKE_EXCHANGE }}
          CEX_BROKER_SMOKE_SYMBOL: ${{ vars.ARCHIVE_SMOKE_SYMBOL }}
