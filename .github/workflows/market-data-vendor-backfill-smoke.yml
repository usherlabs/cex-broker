name: Market Data Vendor Backfill Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-data-vendor-backfill-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: market-data-vendor-backfill-smoke

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run protected live-provider promotion smoke
        run: bun run test:smoke:market-data-vendor-backfill
        env:
          MARKET_DATA_VENDOR_BACKFILL_SMOKE_ENABLED: "1"
          MARKET_DATA_VENDOR_BACKFILL_SMOKE_START_MS: ${{ vars.MARKET_DATA_VENDOR_BACKFILL_SMOKE_START_MS }}
          MARKET_DATA_VENDOR_BACKFILL_SMOKE_EVIDENCE_PATH: ${{ runner.temp }}/market-data-vendor-backfill-smoke-evidence.json
          CRYPTOHFTDATA_API_KEY: ${{ secrets.CRYPTOHFTDATA_API_KEY }}

      - name: Retain hash-only smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-vendor-backfill-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/market-data-vendor-backfill-smoke-evidence.json
          if-no-files-found: error
          retention-days: 90
