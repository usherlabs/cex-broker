[project]
name = "cex-broker-research"
version = "0.1.0"
description = "ClickHouse research toolkit for cex-broker archived candles"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.7.0",
    "pandas>=2.0.0",
	"pyarrow>=14.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
